spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/quizdb
    username: quiz
    password: quiz
app:
