    secret: test-only-secret-32chars-minimum-required-for-hmac-sha-256
    expiry-minutes: 60
  seed:
    enabled: true
  cors:
    allowed-origins: http://localhost
logging:
  level:
    com.anhtduong.quiz: INFO
